kind = "web"
previewPath = "/home/"
title = "SecureOps — Home"
version = "1.0.0"
id = "artifacts/home"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/home/" ]
localPort = 22707

[services.development]
run = "pnpm --filter @workspace/home run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home", "run", "build" ]
publicDir = "artifacts/home/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22707"
BASE_PATH = "/home/"
