      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
                message: { type: string }
      responses:
        "201":
          description: Emergency created
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
                  callNumber: { type: string }
                  adminCount: { type: integer }
                required: [incident, callNumber, adminCount]

  /chat/users:
    get:
      operationId: getChatUsers
      tags: [chat]
      summary: List users available for direct messaging
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"

  /chat/direct:
    post:
      operationId: createDirectChat
      tags: [chat]
      summary: Get or create a direct message room with another user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otherUserId:
                  type: string
              required: [otherUserId]
      responses:
        "200":
          description: Direct room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoom"

  /chat/rooms/{id}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get messages for a room
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }

  /me/storage/sign:
    get:
      tags: [storage]
      operationId: signMyObjectDownload
      summary: Mint a short-lived presigned GET URL for one of the caller's own documents
      description: |
        Authenticated employees can sign a download URL only for object paths
        that are referenced by their own employee record (photo, CV, license,
        passport, right-to-work, pay stub, training certificates).
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
          description: Object path beginning with `/objects/`.
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Not the owner of this object }
        "404": { description: Object not found }

  /admin/storage/sign:
    get:
      tags: [storage]
      operationId: adminSignObjectDownload
      summary: Mint a short-lived presigned GET URL for a private object
      description: |
        Admin-only. Returns a presigned download URL (TTL ~5 min) for an object
        path beginning with `/objects/`. Used by the admin UI to view applicant
        documents without proxying bytes through the API server.
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
          description: Object path beginning with `/objects/`.
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Admin access required }
        "404": { description: Object not found }

  /applications:
    post:
      tags: [applications]
      operationId: submitApplication
      summary: Submit a public job application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitApplicationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }

  /admin/applications:
    get:
      tags: [applications]
      operationId: adminListApplications
      summary: List all job applications
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string }, description: "Case-insensitive partial match on applicant city." }
        - { name: nearSiteId, in: query, schema: { type: string }, description: "When set together with maxMiles, only returns applicants whose geocoded address is within maxMiles of this site's coordinates." }
        - { name: maxMiles, in: query, schema: { type: number }, description: "Distance radius in miles for nearSiteId filter. Required when nearSiteId is set." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }

  /admin/applications/{id}:
    get:
      tags: [applications]
      operationId: adminGetApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }

  /admin/applications/{id}/review:
    post:
      tags: [applications]
      operationId: adminMarkApplicationUnderReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewApplicationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }

  /admin/applications/{id}/reject:
    post:
      tags: [applications]
      operationId: adminRejectApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewApplicationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }

  /admin/applications/{id}/approve:
    post:
      tags: [applications]
      operationId: adminApproveApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewApplicationRequest" }
      responses:
        "200":
          description: Approved with onboarding link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveApplicationResponse" }

  /onboarding/{token}:
    get:
      tags: [onboarding]
      operationId: getOnboardingPrefill
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPrefill" }
        "404":
          description: Invalid/expired/consumed token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [onboarding]
      operationId: submitOnboarding
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitOnboardingRequest" }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSubmission" }

  /admin/onboarding:
    get:
      tags: [onboarding]
      operationId: adminListOnboarding
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, completed] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingListItem" }

  /admin/onboarding/{employeeId}:
    get:
      tags: [onboarding]
      operationId: adminGetOnboarding
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingDetail" }

  /admin/onboarding/{employeeId}/resend:
    post:
      tags: [onboarding]
      operationId: adminResendOnboardingLink
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Link reissued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingLinkResponse" }

  /admin/policies:
    get:
      tags: [policies]
      operationId: adminListPolicies
      description: List all policy slugs grouped by slug, with the active version and full version history.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyGroup" }
    post:
      tags: [policies]
      operationId: adminCreatePolicy
      description: Create a new policy slug at version 1 with no document attached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePolicyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "409":
          description: Slug already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/policies/{id}:
    patch:
      tags: [policies]
      operationId: adminUpdatePolicy
      description: Rename a policy (applies label to all versions of its slug) and/or activate/deactivate it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePolicyRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [policies]
      operationId: adminDeletePolicy
      description: |
        Hard-delete a policy slug and all its version history. Refuses with 409
        if any version is referenced by an existing onboarding submission —
        admin should deactivate instead.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: In use by submissions — deactivate instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/policies/{id}/replace:
    post:
      tags: [policies]
      operationId: adminReplacePolicyDocument
      description: |
        Replace the document for a policy slug. Inserts a new immutable
        version row at (max version + 1), demotes all prior versions of the
        slug to inactive, and marks the new row active.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePolicyDocumentRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /policies/active:
    get:
      tags: [policies]
      operationId: listActivePolicies
      description: |
        Authenticated — list of active policies (with signed document URLs).
        The public onboarding form does NOT use this endpoint; it receives
        the same data inside the token-scoped /onboarding/{token} prefill
        so signed URLs are never exposed to unauthenticated callers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyPublic" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, employee]
        status:
          type: string
          enum: [active, inactive, pending]
        mustChangePassword:
          type: boolean
          description: "True when the user must change their password before accessing the app."
        mustCompleteProfile:
          type: boolean
          description: "True after first password change until the user has reviewed/saved their profile."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - status
        - createdAt

    Employee:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, employee]
        status:
          type: string
          enum: [active, inactive, pending]
        address:
          type: string
        # --- Identity / right-to-work (mirrored from application) ---
        dateOfBirth: { type: string, format: date, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true, description: "SSN last-4 (column name retains UK origin)" }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true, description: "Object-storage path for right-to-work doc" }
        # --- TX security license (mirrored from application) ---
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string, format: date, nullable: true }
        licenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        # --- Experience ---
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        references: { type: array, nullable: true, items: { type: object } }
        # --- Personal docs ---
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys: { type: array, nullable: true, items: { type: string } }
        availability: { type: object, nullable: true, additionalProperties: true }
        # --- Emergency contact ---
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string }
        # --- Pay & banking (mirrored from onboarding) ---
        hourlyRate: { type: number }
        bankAccountName: { type: string }
        bankAccountNumber: { type: string }
        bankBsb: { type: string, description: "Routing / sort code" }
        taxCode: { type: string, nullable: true }
        payStubDocKey: { type: string, nullable: true, description: "W-2 / pay stub object-storage path" }
        # --- Uniform sizes (mirrored from onboarding) ---
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        # --- Consents (mirrored from onboarding) ---
        directDepositConsent: { type: boolean, nullable: true }
        directDepositSignature: { type: string, nullable: true }
        acknowledgements: { type: object, nullable: true, additionalProperties: true }
        # --- HR pipeline links ---
        applicationId: { type: string, nullable: true }
        onboardingSubmissionId: { type: string, nullable: true }
        skills:
          type: array
          items:
            type: string
        licenseCount:
          type: integer
        expiringLicenseCount:
          type: integer
        maxLicenseLevel:
          type: integer
          nullable: true
          description: "Highest valid (non-expired) license level: 2, 3, or 4. Null if no valid license."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - email
        - firstName
        - lastName
        - role
        - status
        - createdAt

    CreateEmployeeRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [admin, employee]
        phone: { type: string }
        address: { type: string }
        dateOfBirth: { type: string, format: date, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string, format: date, nullable: true }
        licenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys: { type: array, nullable: true, items: { type: string } }
        availability: { type: object, nullable: true, additionalProperties: true }
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string }
        hourlyRate: { type: number }
        bankAccountName: { type: string }
