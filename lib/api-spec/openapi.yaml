        bankAccountNumber: { type: string }
        bankBsb: { type: string }
        taxCode: { type: string, nullable: true }
        payStubDocKey: { type: string, nullable: true }
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        directDepositConsent: { type: boolean, nullable: true }
        directDepositSignature: { type: string, nullable: true }
        references: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        acknowledgements: { type: object, nullable: true, additionalProperties: true }
        skills:
          type: array
          items:
            type: string

    Shift:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        siteId: { type: string }
        siteName: { type: string }
        clientName: { type: string }
        clientId: { type: string }
        location: { type: string }
        locationLat: { type: number }
        locationLng: { type: number }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        payRate: { type: number, description: "What the officer earns per hour" }
        billRate: { type: number, description: "What the client is billed per hour" }
        hourlyRate: { type: number, description: "Legacy alias for payRate" }
        billableRate: { type: number, description: "Legacy alias for billRate" }
        status:
          type: string
          enum: [upcoming, active, completed, cancelled]
        shiftType:
          type: string
          enum: [standard, ppo_detail]
          description: "'standard' guard shift or 'ppo_detail' executive/close-protection detail (unlocks the protection package)"
        requiredLicenseLevel:
          type: integer
          enum: [1, 2, 3, 4]
          description: "Minimum license level required (1=support/no licence, 2=unarmed, 3=armed, 4=PPO)"
        headcount:
          type: integer
          description: Total number of officers needed for this shift
        isRepeat: { type: boolean }
        repeatPattern:
          type: string
          enum: [daily, weekly, fortnightly, monthly]
        notes: { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ShiftAssignment" }
        distanceMilesFromHome:
          type: number
          nullable: true
          description: "Miles from the requesting employee's geocoded home address to the shift's site (haversine). Null when caller is admin/dispatcher, when either the employee or the site has no coords on file, or when the shift has no site. Used by the mobile open-shifts list to sort nearest-first and to prompt confirmation on shifts 50+ miles away."
        createdAt: { type: string, format: date-time }
      required:
        - id
        - title
        - startTime
        - endTime
        - status
        - requiredLicenseLevel
        - headcount
        - isRepeat
        - createdAt

    CreateShiftRequest:
      type: object
      properties:
        title: { type: string }
        siteId: { type: string, description: "Required — links shift to a site (and its client)" }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        payRate: { type: number, description: "Officer pay per hour" }
        billRate: { type: number, description: "Client bill per hour" }
        requiredLicenseLevel:
          type: integer
          enum: [1, 2, 3, 4]
        headcount:
          type: integer
          minimum: 1
        isRepeat: { type: boolean }
        repeatPattern:
          type: string
          enum: [daily, weekly, fortnightly, monthly]
        shiftType:
          type: string
          enum: [standard, ppo_detail]
          description: "'ppo_detail' unlocks the executive-protection package; defaults to 'standard'"
        notes: { type: string }
      required:
        - title
        - siteId
        - startTime
        - endTime
        - payRate
        - billRate
        - requiredLicenseLevel
        - isRepeat

    UpdateShiftRequest:
      type: object
      properties:
        title: { type: string }
        siteId: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        payRate: { type: number }
        billRate: { type: number }
        status:
          type: string
          enum: [upcoming, active, completed, cancelled]
        requiredLicenseLevel:
          type: integer
          enum: [1, 2, 3, 4]
        headcount:
          type: integer
          minimum: 1
        shiftType:
          type: string
          enum: [standard, ppo_detail]
        notes: { type: string }

    ShiftAssignment:
      type: object
      properties:
        id:
          type: string
        shiftId:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, pending_approval]
          description: >-
            Assignment state. `pending` = admin-invited, awaiting the officer's
            acceptance. `pending_approval` = officer self-claimed, awaiting an
            admin's approval (slot is held — counts toward headcount — but the
            officer is not yet confirmed). `accepted` = confirmed on the roster.
            `declined` = removed (the row is deleted, freeing the slot).
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - shiftId
        - employeeId
        - status
        - createdAt

    AssignShiftRequest:
      type: object
      properties:
        employeeId:
          type: string
        overrideLicense:
          type: boolean
          description: >-
            When true, an admin or dispatcher bypasses the shift's
            license-level requirement for this assignment. Only the clearance
            check is skipped; the double-book conflict guard and headcount cap
            still apply. The override is recorded in the audit log.
      required:
        - employeeId

    UpdateAssignmentRequest:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, declined]
      required:
        - status

    UiPreferences:
      type: object
      description: "Per-user UI personalization. Cosmetic only — never authorization."
      properties:
        navGroupOrder:
          type: array
          description: "Preferred order of portal nav group keys. Unknown keys are ignored; missing groups append in default order."
          maxItems: 30
          items:
            type: string
            maxLength: 40

    ProtectionPerson:
      type: object
      description: A principal (protectee) or threat/subject of interest on a protection detail.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [principal, threat]
        seq: { type: integer }
        name: { type: string, nullable: true }
        relationship: { type: string, nullable: true }
        sex: { type: string, nullable: true }
        age: { type: string, nullable: true }
        height: { type: string, nullable: true }
        weight: { type: string, nullable: true }
        hairColor: { type: string, nullable: true }
        eyeColor: { type: string, nullable: true }
        distinguishingFeatures: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        photoKeys:
          type: array
          items: { type: string }
      required:
        - id
        - kind
        - seq
        - photoKeys

    ProtectionDestination:
      type: object
      description: An ordered, geocoded stop on a protection detail's itinerary.
      properties:
        id: { type: string }
        seq: { type: integer }
        label: { type: string, nullable: true }
        address: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        arrivalTime: { type: string, format: date-time, nullable: true }
        departureTime: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
      required:
        - id
        - seq

    ProtectionDetail:
      type: object
      description: >-
        Full executive-protection (PPO) package for a shift. Pre-plan fields plus
        principals, threats, and destinations. Empty/null when not yet built.
      properties:
        shiftId: { type: string }
        threatLevel: { type: string, nullable: true }
        missionSummary: { type: string, nullable: true }
        dressCode: { type: string, nullable: true }
        armamentInstructions: { type: string, nullable: true }
        communicationPlan: { type: string, nullable: true }
        medicalNotes: { type: string, nullable: true }
        emergencyRendezvous: { type: string, nullable: true }
        vehicleDetails: { type: string, nullable: true }
        specialInstructions: { type: string, nullable: true }
        principals:
          type: array
          items: { $ref: "#/components/schemas/ProtectionPerson" }
        threats:
          type: array
          items: { $ref: "#/components/schemas/ProtectionPerson" }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/ProtectionDestination" }
      required:
        - shiftId
        - principals
        - threats
        - destinations

    ProtectionPersonInput:
      type: object
      description: Input shape for one principal or threat. `kind` is implied by which array it appears in.
      properties:
        name: { type: string, maxLength: 200 }
        relationship: { type: string, maxLength: 200 }
        sex: { type: string, maxLength: 100 }
        age: { type: string, maxLength: 100 }
        height: { type: string, maxLength: 100 }
        weight: { type: string, maxLength: 100 }
        hairColor: { type: string, maxLength: 100 }
        eyeColor: { type: string, maxLength: 100 }
        distinguishingFeatures: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 4000 }
        photoKeys:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 500 }

    ProtectionDestinationInput:
      type: object
      properties:
        label: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        lat: { type: number }
        lng: { type: number }
        arrivalTime: { type: string, format: date-time }
        departureTime: { type: string, format: date-time }
        notes: { type: string, maxLength: 4000 }

    ProtectionDetailRequest:
      type: object
      description: >-
        Replace-all body for a shift's PPO package. Every field optional; sending
        empty arrays clears the corresponding section.
      properties:
        threatLevel: { type: string, maxLength: 200 }
        missionSummary: { type: string, maxLength: 8000 }
        dressCode: { type: string, maxLength: 4000 }
        armamentInstructions: { type: string, maxLength: 4000 }
        communicationPlan: { type: string, maxLength: 4000 }
        medicalNotes: { type: string, maxLength: 4000 }
        emergencyRendezvous: { type: string, maxLength: 4000 }
        vehicleDetails: { type: string, maxLength: 4000 }
        specialInstructions: { type: string, maxLength: 8000 }
        principals:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProtectionPersonInput" }
        threats:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProtectionPersonInput" }
        destinations:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProtectionDestinationInput" }

    TimeEntry:
      type: object
      properties:
        id:
          type: string
        shiftId:
          type: string
        shiftTitle:
          type: string
        employeeId:
          type: string
        employeeName:
          type: string
        clockInTime:
          type: string
          format: date-time
        clockInLat:
          type: number
        clockInLng:
          type: number
        clockOutTime:
          type: string
          format: date-time
        clockOutLat:
          type: number
        clockOutLng:
          type: number
        hoursWorked:
          type: number
        isVerified:
          type: boolean
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
        siteId:
          type: string
        siteName:
          type: string
        payRate:
          type: number
        billRate:
          type: number
        notes:
          type: string
        correctionRequested:
          type: boolean
        correctionNote:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - shiftId
        - employeeId
        - clockInTime
        - isVerified
        - approvalStatus
        - createdAt

    ClockInRequest:
      type: object
      description: |
        Clock in. Resolution priority: (1) if shiftId is provided, the entry is linked to
        that shift (no geo check); (2) else if siteId is provided, the entry is linked to
        that explicitly-picked site (no geo check — used when GPS is unavailable or the site
        has no saved coordinates); (3) else the server geo-resolves the nearest Site within
        1 mile of (lat, lng) and links that. lat/lng are optional when shiftId or siteId is
        supplied.
      properties:
        shiftId:
          type: string
          nullable: true
        siteId:
          type: string
          nullable: true
          description: Explicitly chosen site. Skips geo-resolution; coordinates not required.
        lat:
          type: number
        lng:
          type: number
        notes:
          type: string

    ClockOutRequest:
      type: object
      properties:
        timeEntryId:
          type: string
        lat:
          type: number
        lng:
          type: number
        notes:
          type: string
        correctionNote:
          type: string
          description: |
            Optional officer-submitted time-correction request. When present, the
            entry is flagged so admins know the recorded clock in/out times need
            adjusting before approval.
      required:
        - timeEntryId
        - lat
        - lng

