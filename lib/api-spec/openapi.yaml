      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]

  /admin/active-officers:
    get:
      operationId: getActiveOfficers
      tags: [liveops]
      summary: List currently clocked-in officers with last known location
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active officers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveOfficer"

  /emergency:
