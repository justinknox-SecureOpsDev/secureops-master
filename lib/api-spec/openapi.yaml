      properties:
        key: { type: string, description: "Stable built-in field identifier." }
        section: { type: integer, description: "Wizard step index (0=Personal, 1=I-9 & Identity, 2=TX License & experience, 3=References & docs, 4=Availability)." }
        label: { type: string, description: "Effective label (override or default)." }
        helpText: { type: string, nullable: true, description: "Effective help text (override or default; null when none)." }
        required: { type: boolean, description: "Effective required-ness. Always true for locked fields." }
        hidden: { type: boolean, description: "Whether the field is hidden from the public form. Always false for locked fields." }
        sortOrder: { type: integer, description: "Effective order within the field's section." }
        locked: { type: boolean, description: "Locked fields (firstName, lastName, email, phone, address) stay required+visible; only the label may be changed." }

    ApplicationTemplate:
      type: object
      required: [questions, fieldConfig]
      properties:
        questions:
          type: array
          description: "Admin-defined custom questions, in display order."
          items: { $ref: "#/components/schemas/ApplicationQuestion" }
        fieldConfig:
          type: array
          description: "Effective config for built-in fields, sorted by section then sortOrder."
          items: { $ref: "#/components/schemas/ApplicationFieldConfig" }

    UpdateApplicationFieldRequest:
      type: object
      description: |
        Partial override for a built-in field. Omitted keys leave the existing
        override untouched. For helpText, null clears any override (revert to
        default); empty string hides the default help text. requiredOverride and
        hidden are ignored for locked fields.
      properties:
        labelOverride: { type: string, nullable: true, description: "Rename the field. Null/empty reverts to the built-in default label." }
        helpTextOverride: { type: string, nullable: true, description: "Override help text. Null reverts to default; empty string clears help." }
        requiredOverride: { type: boolean, nullable: true, description: "Force required/optional. Null reverts to the built-in default. Ignored for locked fields." }
        hidden: { type: boolean, description: "Hide/show the field. Ignored for locked fields." }

    ReorderApplicationFieldsRequest:
      type: object
      required: [section, keys]
      properties:
        section: { type: integer, description: "Section index whose fields are being reordered." }
        keys:
          type: array
          description: "Complete ordered list of the field keys in this section."
          items: { type: string }

    SubmitApplicationRequest:
      type: object
      # Only the five locked core fields are unconditionally required at the
      # contract level. Every other built-in field is conditionally required
      # based on the admin's per-field config (application_field_config), which
      # the server enforces dynamically in POST /applications.
      required:
        - firstName
        - lastName
        - email
        - phone
        - address
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone:
          type: string
          description: |
            Phone number. Free-text accepted (e.g. "(214) 555-1234", "214-555-1234", "+44 20 1234 5678");
            server normalizes to E.164 on submit, defaulting to US/+1 when no country code is present.
            Invalid numbers (not 10 US digits, not 11 US digits starting with 1, or not "+" followed by 8–15 digits)
            return 400.
        address: { type: string, description: "Street address (line 1, optionally line 2)" }
        city: { type: string }
        state: { type: string, description: "US state code, e.g. TX" }
        zip: { type: string }
        dateOfBirth: { type: string }
        cityOfBirth: { type: string }
        stateOfBirth: { type: string }
        niNumber: { type: string }
        rightToWorkStatus:
          type: string
          nullable: true
          deprecated: true
          description: "Deprecated US right-to-work status string (kept for back-compat; I-9 + SSN + photo ID are the authoritative US set)."
        rightToWorkDoc:
          allOf: [{ $ref: "#/components/schemas/UploadedFile" }]
          nullable: true
          deprecated: true
          description: "Deprecated right-to-work document (kept for back-compat; I-9 + SSN + photo ID are the authoritative US set)."
        i9Doc: { $ref: "#/components/schemas/UploadedFile", description: "Completed Form I-9." }
        ssnCardDoc: { $ref: "#/components/schemas/UploadedFile", description: "Photo/scan of Social Security card." }
        idDocType: { type: string, enum: [drivers_license, passport], description: "Which ID accompanies the SSN card." }
        idDoc: { $ref: "#/components/schemas/UploadedFile", description: "Photo/scan of driver's license OR passport." }
        siaLicenseNumber: { type: string }
        siaLicenseLevel: { type: integer, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string }
        previousExperience: { type: string }
        yearsExperience: { type: integer }
        references:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReference" }
        photo: { $ref: "#/components/schemas/UploadedFile" }
        cv: { $ref: "#/components/schemas/UploadedFile" }
        trainingCertificates:
          type: array
          items: { $ref: "#/components/schemas/UploadedFile" }
        availability:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityCell" }
        customAnswers:
          type: array
          nullable: true
          description: "Answers to admin-defined custom questions (application_questions)."
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId: { type: string }
              value: {}

    Application:
      type: object
      required: [id, status, firstName, lastName, email, phone, address, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [submitted, under_review, info_requested, awaiting_second_approval, approved, rejected] }
