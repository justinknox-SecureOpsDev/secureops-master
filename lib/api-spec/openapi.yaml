  /admin/policies:
    get:
      tags: [policies]
      operationId: adminListPolicies
      description: List all policy slugs grouped by slug, with the active version and full version history.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyGroup" }
    post:
      tags: [policies]
      operationId: adminCreatePolicy
      description: Create a new policy slug at version 1 with no document attached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePolicyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "409":
          description: Slug already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/policies/{id}:
    patch:
      tags: [policies]
      operationId: adminUpdatePolicy
      description: Rename a policy (applies label to all versions of its slug) and/or activate/deactivate it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePolicyRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [policies]
      operationId: adminDeletePolicy
      description: |
        Hard-delete a policy slug and all its version history. Refuses with 409
        if any version is referenced by an existing onboarding submission —
        admin should deactivate instead.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: In use by submissions — deactivate instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/policies/{id}/replace:
    post:
      tags: [policies]
      operationId: adminReplacePolicyDocument
      description: |
        Replace the document for a policy slug. Inserts a new immutable
        version row at (max version + 1), demotes all prior versions of the
        slug to inactive, and marks the new row active.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePolicyDocumentRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /policies/active:
    get:
      tags: [policies]
      operationId: listActivePolicies
      description: |
        Authenticated — list of active policies (with signed document URLs).
        The public onboarding form does NOT use this endpoint; it receives
        the same data inside the token-scoped /onboarding/{token} prefill
        so signed URLs are never exposed to unauthenticated callers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PolicyPublic" }

  /me/policies/acknowledge:
    post:
      operationId: acknowledgePolicies
      tags: [policies]
      summary: Sign/acknowledge all active company policies and clear the must-sign gate
      description: |
        Authenticated self-service. Records the caller's typed signature against
        every currently-active policy on their employee file and clears the
        users.mustSignPolicies gate. Mounted under /me (not /policies) so it is
        never feature-gated — a flagged officer can always clear the gate even on
        a tenant where the policies feature is disabled (no lockout). Safe when
        there are zero active policies (the gate is still cleared).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgePoliciesRequest"
      responses:
        "200":
          description: Policies acknowledged; updated user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

