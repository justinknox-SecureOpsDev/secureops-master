openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SecureOps - Private Security Operations Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employees
    description: Employee management
  - name: shifts
    description: Shift scheduling and management
  - name: timeEntries
    description: Clock in/out and time tracking
  - name: payroll
    description: Payroll processing
  - name: invoices
    description: Client invoice management
  - name: incidents
    description: Incident reporting
  - name: licenses
    description: License compliance management
  - name: dashboard
    description: Dashboard summaries
  - name: chat
    description: Team chat messaging
  - name: clients
    description: Client management with payment terms
  - name: sites
    description: Sites under a client (each holds its own shifts)

paths:
  /clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: List clients
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client (with sites)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClientRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /clients/{id}/sites:
    post:
      operationId: createClientSite
      tags: [sites]
      summary: Create a site under a client
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }

  /sites:
    get:
      operationId: getSites
      tags: [sites]
      summary: List sites (optionally filter by clientId)
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get site
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
    put:
      operationId: updateSite
      tags: [sites]
      summary: Update site
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete site
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /time-entries/{id}/approve:
    post:
      operationId: approveTimeEntry
      tags: [timeEntries]
      summary: Approve or reject a time entry (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveTimeEntryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /payroll/generate:
    post:
      operationId: generatePayroll
      tags: [payroll]
      summary: Generate weekly payroll for a site from approved time entries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratePayrollRequest" }
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayrollEntry" }

  /invoices/generate:
    post:
      operationId: generateInvoice
      tags: [invoices]
      summary: Generate weekly invoice for a site from approved time entries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateInvoiceRequest" }
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/push-token:
    post:
      operationId: registerPushToken
      tags: [auth]
      summary: Register Expo push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "200":
          description: Token registered

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password (clears mustChangePassword and rotates the JWT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; new JWT returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/employee:
    patch:
      operationId: updateMyEmployeeProfile
      tags: [employees]
      summary: Self-service edit of allow-listed employee profile fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyEmployeeRequest"
      responses:
        "200":
          description: Updated employee row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMyEmployeeResponse"
        "400":
          description: Validation failed or non-allow-listed field provided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Employee row not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link (always returns 200, even if no account matches, to avoid email enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/reset-password/{token}:
    get:
      operationId: getPasswordResetToken
      tags: [auth]
      summary: Validate a password reset token and return the masked email it belongs to
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetTokenInfo"
        "404":
          description: Invalid, expired or already-used token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Consume a password reset token and set a new password (clears mustChangePassword and rotates the JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset; new JWT returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Invalid, expired or already-used token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees:
    get:
      operationId: getEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}/changes:
    get:
      operationId: getEmployeeChanges
      tags: [employees]
      summary: Recent per-field profile change log
      description: |
        Returns the most recent profile edits for one employee, newest
        first. Admin can read any employee's log; non-admin callers may
        only read their own. Sensitive field values (bank account number,
        SSN, signature) are masked at write time.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Change log
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeeChange"

  /shifts:
    get:
      operationId: getShifts
      tags: [shifts]
      summary: List shifts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, active, completed, cancelled]
        - name: employeeId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Create a new shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [shifts]
      summary: Get shift by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    put:
      operationId: updateShift
      tags: [shifts]
      summary: Update shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Delete shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /shifts/{id}/claim:
    post:
      operationId: claimShift
      tags: [shifts]
      summary: Employee self-signs up for a shift (license-gated)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"
        "403":
          description: License level too low
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Shift already filled or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}/assignments:
    post:
      operationId: assignEmployeeToShift
      tags: [shifts]
      summary: Assign employee to a shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignShiftRequest"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"

  /shifts/{id}/notify-vacancy:
    post:
      operationId: notifyShiftVacancy
      tags: [shifts]
      summary: Push reminder to qualified, unassigned officers about an open vacancy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifiedCount: { type: integer }
                  vacanciesRemaining: { type: integer }
                required: [notifiedCount, vacanciesRemaining]
        "404":
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Shift already fully staffed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}/assignments/{assignmentId}:
    put:
      operationId: updateShiftAssignment
      tags: [shifts]
      summary: Update assignment status (accept/decline)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftAssignment"

  /time-entries:
    get:
      operationId: getTimeEntries
      tags: [timeEntries]
      summary: Get time entries
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
        - name: shiftId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"

  /time-entries/clock-in:
    post:
      operationId: clockIn
      tags: [timeEntries]
      summary: Clock in to a shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockInRequest"
      responses:
        "201":
          description: Clocked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-entries/clock-out:
    post:
      operationId: clockOut
      tags: [timeEntries]
      summary: Clock out from current shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockOutRequest"
      responses:
        "200":
          description: Clocked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-entries/active:
    get:
      operationId: getActiveTimeEntry
      tags: [timeEntries]
      summary: Get current active time entry for logged in employee
      responses:
        "200":
          description: Active time entry, or null when the caller is not currently clocked in.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TimeEntry"
                  - type: "null"

  /payroll:
    get:
      operationId: getPayrollEntries
      tags: [payroll]
      summary: Get payroll entries
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, paid]
        - name: periodStart
          in: query
          schema:
            type: string
            format: date
        - name: periodEnd
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of payroll entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollEntry"
    post:
      operationId: createPayrollEntry
      tags: [payroll]
      summary: Create payroll entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayrollRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollEntry"

  /payroll/{id}:
    put:
      operationId: updatePayrollEntry
      tags: [payroll]
      summary: Update payroll entry status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePayrollRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollEntry"

  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, paid, overdue]
        - name: clientName
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    put:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /incidents:
    get:
      operationId: getIncidents
      tags: [incidents]
      summary: List incidents
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
        - name: shiftId
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, under_review, resolved, closed]
      responses:
        "200":
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Report an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
