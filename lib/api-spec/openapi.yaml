      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, employee, site_manager]
        status:
          type: string
          enum: [active, inactive, pending]
        mustChangePassword:
          type: boolean
          description: "True when the user must change their password before accessing the app."
        mustCompleteProfile:
          type: boolean
          description: "True after first password change until the user has reviewed/saved their profile."
        mustSignPolicies:
          type: boolean
          description: "True when the user must sign/acknowledge company policies before accessing the mobile app (non-admin staff only)."
        createdAt:
          type: string
          format: date-time
        uiPreferences:
          $ref: "#/components/schemas/UiPreferences"
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - status
        - createdAt

    AcknowledgePoliciesRequest:
      type: object
      properties:
        signature:
          type: string
          description: "The caller's typed full legal name, applied as their signature to every active policy."
          minLength: 2
          maxLength: 120
      required:
        - signature

    Employee:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, employee, site_manager]
        status:
          type: string
          enum: [active, inactive, pending]
        address:
          type: string
        # --- Identity / right-to-work (mirrored from application) ---
        dateOfBirth: { type: string, format: date, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true, description: "SSN last-4 (column name retains UK origin)" }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true, description: "Object-storage path for right-to-work doc" }
        # --- TX security license (mirrored from application) ---
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string, format: date, nullable: true }
        licenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        # --- Experience ---
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        references: { type: array, nullable: true, items: { type: object } }
        # --- Personal docs ---
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys: { type: array, nullable: true, items: { type: string } }
        availability: { type: object, nullable: true, additionalProperties: true }
        # --- Emergency contact ---
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string }
        # --- Pay & banking (mirrored from onboarding) ---
        hourlyRate: { type: number }
        bankAccountName: { type: string }
        bankAccountNumber: { type: string }
        bankBsb: { type: string, description: "Routing / sort code" }
        taxCode: { type: string, nullable: true }
        payStubDocKey: { type: string, nullable: true, description: "W-2 / pay stub object-storage path" }
        # --- Uniform sizes (mirrored from onboarding) ---
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        # --- Consents (mirrored from onboarding) ---
        directDepositConsent: { type: boolean, nullable: true }
        directDepositSignature: { type: string, nullable: true }
        acknowledgements: { type: object, nullable: true, additionalProperties: true }
        # --- HR pipeline links ---
        applicationId: { type: string, nullable: true }
        onboardingSubmissionId: { type: string, nullable: true }
        skills:
          type: array
          items:
            type: string
        licenseCount:
          type: integer
        expiringLicenseCount:
          type: integer
        position:
          type: string
          enum: [officer, support_staff]
          description: "Job position. 'officer' work licensed security shifts; 'support_staff' are non-licensed and may work level-1 (support / no licence required) shifts."
        maxLicenseLevel:
          type: integer
          nullable: true
          description: "Highest valid (non-expired) license level: 2, 3, or 4. Null if no valid license. Note: this reflects licences only — a support_staff officer with no licence is still null here."
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - email
        - firstName
        - lastName
        - role
        - status
        - createdAt

