            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RadioTransmission" }

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }

  /me/storage/sign:
    get:
      tags: [storage]
      operationId: signMyObjectDownload
      summary: Mint a short-lived presigned GET URL for one of the caller's own documents
      description: |
        Authenticated employees can sign a download URL only for object paths
        that are referenced by their own employee record (photo, CV, license,
        passport, right-to-work, pay stub, training certificates).
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
          description: Object path beginning with `/objects/`.
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Not the owner of this object }
        "404": { description: Object not found }

  /admin/storage/sign:
    get:
      tags: [storage]
      operationId: adminSignObjectDownload
      summary: Mint a short-lived presigned GET URL for a private object
      description: |
        Admin-only. Returns a presigned download URL (TTL ~5 min) for an object
        path beginning with `/objects/`. Used by the admin UI to view applicant
        documents without proxying bytes through the API server.
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
          description: Object path beginning with `/objects/`.
      responses:
        "200":
          description: Signed URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { description: Bad request }
        "401": { description: Unauthorized }
        "403": { description: Admin access required }
        "404": { description: Object not found }

