    ApplicationFieldConfig:
      type: object
      required: [key, section, label, required, hidden, sortOrder, locked]
      properties:
        key: { type: string, description: "Stable built-in field identifier." }
        section: { type: integer, description: "Wizard step index (0=Personal, 1=I-9 & Identity, 2=TX License & experience, 3=References & docs, 4=Availability)." }
        label: { type: string, description: "Effective label (override or default)." }
        helpText: { type: string, nullable: true, description: "Effective help text (override or default; null when none)." }
        required: { type: boolean, description: "Effective required-ness. Always true for locked fields." }
        hidden: { type: boolean, description: "Whether the field is hidden from the public form. Always false for locked fields." }
        sortOrder: { type: integer, description: "Effective order within the field's section." }
        locked: { type: boolean, description: "Locked fields (firstName, lastName, email, phone, address) stay required+visible; only the label may be changed." }

    ApplicationTemplate:
      type: object
      required: [questions, fieldConfig]
      properties:
        questions:
          type: array
          description: "Admin-defined custom questions, in display order."
          items: { $ref: "#/components/schemas/ApplicationQuestion" }
        fieldConfig:
          type: array
          description: "Effective config for built-in fields, sorted by section then sortOrder."
          items: { $ref: "#/components/schemas/ApplicationFieldConfig" }

    UpdateApplicationFieldRequest:
      type: object
      description: |
        Partial override for a built-in field. Omitted keys leave the existing
        override untouched. For helpText, null clears any override (revert to
        default); empty string hides the default help text. requiredOverride and
        hidden are ignored for locked fields.
      properties:
        labelOverride: { type: string, nullable: true, description: "Rename the field. Null/empty reverts to the built-in default label." }
        helpTextOverride: { type: string, nullable: true, description: "Override help text. Null reverts to default; empty string clears help." }
        requiredOverride: { type: boolean, nullable: true, description: "Force required/optional. Null reverts to the built-in default. Ignored for locked fields." }
        hidden: { type: boolean, description: "Hide/show the field. Ignored for locked fields." }

    ReorderApplicationFieldsRequest:
      type: object
      required: [section, keys]
      properties:
        section: { type: integer, description: "Section index whose fields are being reordered." }
        keys:
          type: array
          description: "Complete ordered list of the field keys in this section."
          items: { type: string }

    SubmitApplicationRequest:
      type: object
      # Only the five locked core fields are unconditionally required at the
      # contract level. Every other built-in field is conditionally required
      # based on the admin's per-field config (application_field_config), which
      # the server enforces dynamically in POST /applications.
      required:
        - firstName
        - lastName
        - email
        - phone
        - address
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone:
          type: string
          description: |
            Phone number. Free-text accepted (e.g. "(214) 555-1234", "214-555-1234", "+44 20 1234 5678");
            server normalizes to E.164 on submit, defaulting to US/+1 when no country code is present.
            Invalid numbers (not 10 US digits, not 11 US digits starting with 1, or not "+" followed by 8–15 digits)
            return 400.
        address: { type: string, description: "Street address (line 1, optionally line 2)" }
        city: { type: string }
        state: { type: string, description: "US state code, e.g. TX" }
        zip: { type: string }
        dateOfBirth: { type: string }
        cityOfBirth: { type: string }
        stateOfBirth: { type: string }
        niNumber: { type: string }
        rightToWorkStatus:
          type: string
          nullable: true
          deprecated: true
          description: "Deprecated US right-to-work status string (kept for back-compat; I-9 + SSN + photo ID are the authoritative US set)."
        rightToWorkDoc:
          allOf: [{ $ref: "#/components/schemas/UploadedFile" }]
          nullable: true
          deprecated: true
          description: "Deprecated right-to-work document (kept for back-compat; I-9 + SSN + photo ID are the authoritative US set)."
        i9Doc:
          allOf: [{ $ref: "#/components/schemas/UploadedFile" }]
          deprecated: true
          description: "Deprecated upload of a completed Form I-9 (replaced by the fillable `i9` object; still accepted so in-flight saved drafts don't break)."
        i9:
          allOf: [{ $ref: "#/components/schemas/I9Section1" }]
          nullable: true
          description: "Form I-9 Section 1, filled in-app. Server appends signedDate on submit."
        ssnCardDoc: { $ref: "#/components/schemas/UploadedFile", description: "Photo/scan of Social Security card." }
        idDocType: { type: string, enum: [drivers_license, passport], description: "Which ID accompanies the SSN card." }
        idDoc: { $ref: "#/components/schemas/UploadedFile", description: "Photo/scan of driver's license OR passport." }
        siaLicenseNumber: { type: string }
        siaLicenseLevel: { type: integer, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string }
        previousExperience: { type: string }
        yearsExperience: { type: integer }
        references:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReference" }
        photo: { $ref: "#/components/schemas/UploadedFile" }
        cv: { $ref: "#/components/schemas/UploadedFile" }
        trainingCertificates:
          type: array
          items: { $ref: "#/components/schemas/UploadedFile" }
        availability:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityCell" }
        customAnswers:
          type: array
          nullable: true
          description: "Answers to admin-defined custom questions (application_questions)."
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId: { type: string }
              value: {}

    I9Section1:
      type: object
      description: >-
        Form I-9 (Employment Eligibility Verification) Section 1, completed
        in-app by the applicant instead of uploading a scanned form. The server
        appends signedDate (business-timezone calendar date) at submit time.
        Section 2 (employer examination of physical documents) remains a manual
        HR step after hire.
      required: [citizenshipStatus, attestation, signatureName]
      properties:
        otherLastNames:
          type: string
          maxLength: 200
          description: "Other last names used, if any (e.g. maiden name). Omit when none."
        citizenshipStatus:
          type: string
          enum: [citizen, noncitizen_national, permanent_resident, authorized_alien]
          description: "Attested status: citizen of the U.S.; noncitizen national of the U.S.; lawful permanent resident; or noncitizen otherwise authorized to work."
        uscisANumber:
          type: string
          maxLength: 20
          description: "USCIS / Alien Registration Number (A-Number). Required for permanent_resident; one of the acceptable identifiers for authorized_alien."
        i94Number:
          type: string
          maxLength: 20
          description: "Form I-94 admission number (authorized_alien identifier option)."
        foreignPassportNumber:
          type: string
          maxLength: 40
          description: "Foreign passport number (authorized_alien identifier option; requires foreignPassportCountry)."
        foreignPassportCountry:
          type: string
          maxLength: 60
          description: "Country of issuance for the foreign passport."
        workAuthExpiration:
          type: string
          maxLength: 20
          description: "Work-authorization expiration date (YYYY-MM-DD) for authorized_alien. Omit when the authorization does not expire (N/A)."
        usedPreparer:
          type: boolean
          description: "True when a preparer and/or translator assisted the applicant in completing Section 1."
        preparerName:
          type: string
          maxLength: 200
          description: "Preparer / translator full name (required when usedPreparer is true)."
        attestation:
          type: boolean
          description: "Must be true — the applicant attests, under penalty of perjury, that they selected the status above and that all information is true and correct."
        signatureName:
          type: string
          minLength: 1
          maxLength: 200
          description: "Typed full legal name, recorded as the applicant's electronic signature."

    Application:
      type: object
      required: [id, status, firstName, lastName, email, phone, address, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [submitted, under_review, info_requested, awaiting_second_approval, approved, rejected] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zip: { type: string, nullable: true }
        locationLat: { type: number, nullable: true, description: "Geocoded latitude (best-effort, may be null)." }
        locationLng: { type: number, nullable: true, description: "Geocoded longitude (best-effort, may be null)." }
        distanceMiles: { type: number, nullable: true, description: "Distance in miles from the queried site. Only populated when nearSiteId+maxMiles filter is active." }
        dateOfBirth: { type: string, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true }
        i9DocKey: { type: string, nullable: true }
        i9Data:
          type: object
          nullable: true
          additionalProperties: true
          description: "In-app Form I-9 Section 1 data as submitted (plus server-set signedDate). Null for legacy applications that uploaded a scanned form instead (see i9DocKey)."
        ssnCardDocKey: { type: string, nullable: true }
        idDocType: { type: string, nullable: true, enum: [drivers_license, passport] }
        idDocKey: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true }
        siaLicenseExpiry: { type: string, nullable: true }
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        references:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ApplicationReference" }
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys:
          type: array
          nullable: true
          items: { type: string }
        availability:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/AvailabilityCell" }
        customAnswers:
          type: array
          nullable: true
          description: "Denormalized answers to admin-defined custom questions: { questionId, label, fieldType, value }."
          items:
            type: object
            additionalProperties: true
        reviewerNotes: { type: string, nullable: true }
        reviewedAt: { type: string, nullable: true }
        firstApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the first of two required approvals (null until first approval)." }
        firstApprovedAt: { type: string, nullable: true }
        secondApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the final (second) approval — must differ from firstApprovedBy." }
        secondApprovedAt: { type: string, nullable: true }
        createdEmployeeId: { type: string, nullable: true }
        onboardingEmailStatus:
          type: string
          nullable: true
          enum: [not_configured, sent, bounced, failed]
          description: "Last known SMTP delivery state for the onboarding/approval email (null if never attempted)."
        onboardingEmailMessageId: { type: string, nullable: true }
        onboardingEmailResponse: { type: string, nullable: true, description: "Raw SMTP response line, when available." }
        onboardingEmailError: { type: string, nullable: true, description: "Human-readable bounce or transport error reason." }
        onboardingEmailSentAt: { type: string, nullable: true }
        onboardingEmailAttemptedAt: { type: string, nullable: true }
        createdAt: { type: string }

    ReviewApplicationRequest:
      type: object
      properties:
        notes: { type: string }

    ApproveApplicationResponse:
      type: object
      required: [application]
      description: |
        Response to an approve action. Employee applications require TWO distinct
        admin approvals before an onboarding link is issued.
        - First approval: `awaitingSecondApproval=true` and only `application`
          (+ `firstApprovedBy`) are returned; no account/link/email is created.
        - Final (second) approval: `awaitingSecondApproval` is absent/false and
          the provisioning fields (`onboardingUrl`, `onboardingToken`,
          `employeeId`, `tempPassword`) are populated.
      properties:
        application: { $ref: "#/components/schemas/Application" }
        awaitingSecondApproval: { type: boolean, description: "True when this was the first of two approvals; no provisioning happened yet." }
        firstApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the first approval (present on the first-approval response)." }
        onboardingUrl: { type: string }
        onboardingToken: { type: string }
        employeeId: { type: string }
        tempPassword: { type: string }
        emailSent: { type: boolean }
        smsStatus:
          type: string
          enum: [sent, skipped, failed]
          description: |
            SMS fallback delivery status for the onboarding link.
            `sent` — Twilio accepted the message.
            `skipped` — Twilio not connected, or applicant phone is not valid E.164.
            `failed` — Twilio rejected the send.

    OnboardingPrefill:
      type: object
      required: [employeeId, firstName, lastName, email, policies]
      properties:
        employeeId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true }
        existing: { type: boolean, description: "True if onboarding already submitted" }
        policies:
          type: array
          description: "Active acknowledgement policies the applicant must view and sign."
          items: { $ref: "#/components/schemas/PolicyPublic" }

    PolicyPublic:
      type: object
      required: [id, slug, label, version, fileName, viewUrl]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        version: { type: integer }
        fileKey: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        viewUrl: { type: string, nullable: true, description: "Signed download URL for the policy PDF" }

    PaymentDiscrepancyType:
      type: string
      enum: [missed_payment, underpaid, missing_hours, incorrect_rate, other]

    CreatePaymentDiscrepancyRequest:
      type: object
      required: [discrepancyType, description]
      properties:
        discrepancyType: { $ref: "#/components/schemas/PaymentDiscrepancyType" }
        payPeriodStart: { type: string, format: date, nullable: true, description: "ISO date (YYYY-MM-DD)" }
        payPeriodEnd: { type: string, format: date, nullable: true, description: "ISO date (YYYY-MM-DD)" }
        shiftDate: { type: string, format: date, nullable: true, description: "ISO date (YYYY-MM-DD)" }
        expectedAmount: { type: number, nullable: true, description: "Amount the officer expected to be paid (USD)" }
        receivedAmount: { type: number, nullable: true, description: "Amount actually received (USD)" }
        description: { type: string, minLength: 1, description: "Details of the discrepancy" }

    PaymentDiscrepancy:
      type: object
      required: [id, employeeId, discrepancyType, description, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        employeeId: { type: string }
        discrepancyType: { $ref: "#/components/schemas/PaymentDiscrepancyType" }
        payPeriodStart: { type: string, format: date, nullable: true }
        payPeriodEnd: { type: string, format: date, nullable: true }
        shiftDate: { type: string, format: date, nullable: true }
        expectedAmount: { type: string, nullable: true, description: "Decimal string (USD)" }
        receivedAmount: { type: string, nullable: true, description: "Decimal string (USD)" }
        description: { type: string }
        status: { type: string, enum: [open, under_review, resolved] }
        adminNotes: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Policy:
      type: object
      required: [id, slug, label, version, isActive, hasDocument]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        version: { type: integer }
        fileKey: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        isActive: { type: boolean }
        uploadedAt: { type: string, format: date-time, nullable: true }
        uploadedBy: { type: string, nullable: true }
        hasDocument: { type: boolean }
        viewUrl: { type: string, nullable: true }

    PolicyGroup:
      type: object
      required: [slug, label, isActive, current, history]
      properties:
