          type: array
          nullable: true
          items: { type: string }
        availability:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/AvailabilityCell" }
        customAnswers:
          type: array
          nullable: true
          description: "Denormalized answers to admin-defined custom questions: { questionId, label, fieldType, value }."
          items:
            type: object
            additionalProperties: true
        reviewerNotes: { type: string, nullable: true }
        reviewedAt: { type: string, nullable: true }
        firstApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the first of two required approvals (null until first approval)." }
        firstApprovedAt: { type: string, nullable: true }
        secondApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the final (second) approval — must differ from firstApprovedBy." }
        secondApprovedAt: { type: string, nullable: true }
        createdEmployeeId: { type: string, nullable: true }
        onboardingEmailStatus:
          type: string
          nullable: true
          enum: [not_configured, sent, bounced, failed]
          description: "Last known SMTP delivery state for the onboarding/approval email (null if never attempted)."
        onboardingEmailMessageId: { type: string, nullable: true }
        onboardingEmailResponse: { type: string, nullable: true, description: "Raw SMTP response line, when available." }
        onboardingEmailError: { type: string, nullable: true, description: "Human-readable bounce or transport error reason." }
        onboardingEmailSentAt: { type: string, nullable: true }
        onboardingEmailAttemptedAt: { type: string, nullable: true }
        createdAt: { type: string }

    ReviewApplicationRequest:
      type: object
      properties:
        notes: { type: string }

    ApproveApplicationResponse:
      type: object
      required: [application]
      description: |
        Response to an approve action. Employee applications require TWO distinct
        admin approvals before an onboarding link is issued.
        - First approval: `awaitingSecondApproval=true` and only `application`
          (+ `firstApprovedBy`) are returned; no account/link/email is created.
        - Final (second) approval: `awaitingSecondApproval` is absent/false and
          the provisioning fields (`onboardingUrl`, `onboardingToken`,
          `employeeId`, `tempPassword`) are populated.
      properties:
        application: { $ref: "#/components/schemas/Application" }
        awaitingSecondApproval: { type: boolean, description: "True when this was the first of two approvals; no provisioning happened yet." }
        firstApprovedBy: { type: string, nullable: true, description: "Admin user id who gave the first approval (present on the first-approval response)." }
        onboardingUrl: { type: string }
        onboardingToken: { type: string }
        employeeId: { type: string }
        tempPassword: { type: string }
        emailSent: { type: boolean }
        smsStatus:
          type: string
          enum: [sent, skipped, failed]
          description: |
            SMS fallback delivery status for the onboarding link.
            `sent` — Twilio accepted the message.
            `skipped` — Twilio not connected, or applicant phone is not valid E.164.
            `failed` — Twilio rejected the send.

