          type: string
        roomId:
          type: string
        userId:
          type: string
        content:
          type: string
        createdAt:
          type: string
        userName:
          type: string
        userRole:
          type: string
      required: [id, roomId, userId, content, createdAt, userName]

    EmployeeDashboardSummary:
      type: object
      properties:
        nextShift:
          $ref: "#/components/schemas/Shift"
        activeTimeEntry:
          $ref: "#/components/schemas/TimeEntry"
        hoursThisWeek:
          type: number
        hoursThisMonth:
          type: number
        upcomingShifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        pendingAssignments:
          type: array
          items:
            $ref: "#/components/schemas/ShiftAssignment"
        myOpenIncidents:
          type: integer
        expiringLicenses:
          type: integer
      required:
        - hoursThisWeek
        - hoursThisMonth
        - upcomingShifts
        - pendingAssignments
        - myOpenIncidents
        - expiringLicenses

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }

    UploadedFile:
      type: object
      required: [name, objectPath]
      properties:
        name: { type: string }
        objectPath: { type: string }
        contentType: { type: string }
        size: { type: integer }

    ApplicationReference:
      type: object
      required: [name, relationship, phone]
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }
        email: { type: string }

    AvailabilityCell:
      type: object
      required: [day, period]
      properties:
        day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        period: { type: string, enum: [morning, afternoon, evening, overnight] }

    SubmitApplicationRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - address
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string, description: "Street address (line 1, optionally line 2)" }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true, description: "US state code, e.g. TX" }
        zip: { type: string, nullable: true }
        dateOfBirth: { type: string, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDoc: { $ref: "#/components/schemas/UploadedFile", nullable: true, description: "Deprecated. Use i9Doc + ssnCardDoc + idDoc." }
        i9Doc: { $ref: "#/components/schemas/UploadedFile", nullable: true, description: "Completed Form I-9." }
        ssnCardDoc: { $ref: "#/components/schemas/UploadedFile", nullable: true, description: "Photo/scan of Social Security card." }
        idDocType: { type: string, nullable: true, enum: [drivers_license, passport], description: "Which ID accompanies the SSN card." }
        idDoc: { $ref: "#/components/schemas/UploadedFile", nullable: true, description: "Photo/scan of driver's license OR passport." }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string, nullable: true }
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        references:
          type: array
          items: { $ref: "#/components/schemas/ApplicationReference" }
        photo: { $ref: "#/components/schemas/UploadedFile", nullable: true }
        cv: { $ref: "#/components/schemas/UploadedFile", nullable: true }
        trainingCertificates:
          type: array
          items: { $ref: "#/components/schemas/UploadedFile" }
        availability:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityCell" }

    Application:
      type: object
      required: [id, status, firstName, lastName, email, phone, address, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [submitted, under_review, approved, rejected] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        zip: { type: string, nullable: true }
        locationLat: { type: number, nullable: true, description: "Geocoded latitude (best-effort, may be null)." }
        locationLng: { type: number, nullable: true, description: "Geocoded longitude (best-effort, may be null)." }
        distanceMiles: { type: number, nullable: true, description: "Distance in miles from the queried site. Only populated when nearSiteId+maxMiles filter is active." }
        dateOfBirth: { type: string, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true }
        i9DocKey: { type: string, nullable: true }
        ssnCardDocKey: { type: string, nullable: true }
        idDocType: { type: string, nullable: true, enum: [drivers_license, passport] }
        idDocKey: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true }
        siaLicenseExpiry: { type: string, nullable: true }
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        references:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ApplicationReference" }
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys:
          type: array
          nullable: true
          items: { type: string }
        availability:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/AvailabilityCell" }
        reviewerNotes: { type: string, nullable: true }
        reviewedAt: { type: string, nullable: true }
        createdEmployeeId: { type: string, nullable: true }
        createdAt: { type: string }

    ReviewApplicationRequest:
      type: object
      properties:
        notes: { type: string }

    ApproveApplicationResponse:
      type: object
      required: [application, onboardingUrl, onboardingToken, employeeId, tempPassword]
      properties:
        application: { $ref: "#/components/schemas/Application" }
        onboardingUrl: { type: string }
        onboardingToken: { type: string }
        employeeId: { type: string }
        tempPassword: { type: string }
        emailSent: { type: boolean }

    OnboardingPrefill:
      type: object
      required: [employeeId, firstName, lastName, email, policies]
      properties:
        employeeId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true }
        existing: { type: boolean, description: "True if onboarding already submitted" }
        policies:
          type: array
          description: "Active acknowledgement policies the applicant must view and sign."
          items: { $ref: "#/components/schemas/PolicyPublic" }

    PolicyPublic:
      type: object
      required: [id, slug, label, version, fileName, viewUrl]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        version: { type: integer }
        fileKey: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        viewUrl: { type: string, nullable: true, description: "Signed download URL for the policy PDF" }

    Policy:
      type: object
      required: [id, slug, label, version, isActive, hasDocument]
      properties:
        id: { type: string }
        slug: { type: string }
        label: { type: string }
        version: { type: integer }
        fileKey: { type: string, nullable: true }
        fileName: { type: string, nullable: true }
        isActive: { type: boolean }
        uploadedAt: { type: string, format: date-time, nullable: true }
        uploadedBy: { type: string, nullable: true }
        hasDocument: { type: boolean }
        viewUrl: { type: string, nullable: true }

    PolicyGroup:
      type: object
      required: [slug, label, isActive, current, history]
      properties:
        slug: { type: string }
        label: { type: string }
        isActive: { type: boolean, description: "True if any version of this slug is currently active" }
        current:
          oneOf:
            - { $ref: "#/components/schemas/Policy" }
            - { type: "null" }
          description: "The currently active version of this policy slug, or null if none active"
        history:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
          description: "All versions of this slug, newest first"

    CreatePolicyRequest:
      type: object
      required: [slug, label]
      properties:
        slug: { type: string, pattern: "^[a-z0-9_]+$" }
        label: { type: string, minLength: 1 }

    UpdatePolicyRequest:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        isActive: { type: boolean }

    ReplacePolicyDocumentRequest:
      type: object
      required: [fileKey, fileName]
      properties:
        fileKey: { type: string, minLength: 1 }
        fileName: { type: string, minLength: 1 }

    Acknowledgement:
      type: object
      required: [type, accepted, signature, timestamp]
      properties:
        type: { type: string }
        accepted: { type: boolean }
        signature: { type: string }
        timestamp: { type: string }
        policyId: { type: string, nullable: true }
        policyVersion: { type: integer, nullable: true }
        policyFileKey: { type: string, nullable: true }
        policyLabel: { type: string, nullable: true }

    SubmitOnboardingRequest:
      type: object
      required: [bankSortCode, bankAccountNumber, bankAccountName, emergencyContactName, emergencyContactPhone, directDepositConsent, directDepositSignature, acknowledgements]
      properties:
        bankSortCode: { type: string }
        bankAccountNumber: { type: string }
        bankAccountName: { type: string }
        niNumberConfirmed: { type: string, nullable: true }
        taxCode: { type: string, nullable: true }
        p45Doc: { $ref: "#/components/schemas/UploadedFile", nullable: true }
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string }
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        siaLicenseDoc: { $ref: "#/components/schemas/UploadedFile", nullable: true }
        passportDoc: { $ref: "#/components/schemas/UploadedFile", nullable: true }
        directDepositConsent: { type: boolean }
        directDepositSignature: { type: string }
        acknowledgements:
          type: array
          items: { $ref: "#/components/schemas/Acknowledgement" }

    OnboardingSubmission:
      type: object
      required: [id, employeeId, submittedAt]
      properties:
        id: { type: string }
        employeeId: { type: string }
        bankSortCode: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankAccountName: { type: string, nullable: true }
        niNumberConfirmed: { type: string, nullable: true }
        taxCode: { type: string, nullable: true }
        p45DocKey: { type: string, nullable: true }
        emergencyContactName: { type: string, nullable: true }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string, nullable: true }
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        siaLicenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        directDepositConsent: { type: boolean }
        directDepositSignature: { type: string, nullable: true }
        acknowledgements:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Acknowledgement" }
        submittedAt: { type: string }

    OnboardingListItem:
      type: object
      required: [employeeId, firstName, lastName, email, status]
      properties:
        employeeId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, completed] }
        tokenExpiresAt: { type: string, nullable: true }
        submittedAt: { type: string, nullable: true }
        applicationId: { type: string, nullable: true }

    OnboardingDetail:
      type: object
      required: [employeeId, firstName, lastName, email, status]
      properties:
        employeeId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        status: { type: string }
        submission: { $ref: "#/components/schemas/OnboardingSubmission", nullable: true }
        tokenExpiresAt: { type: string, nullable: true }
        applicationId: { type: string, nullable: true }

    OnboardingLinkResponse:
      type: object
      required: [onboardingUrl, onboardingToken]
      properties:
        onboardingUrl: { type: string }
        onboardingToken: { type: string }
        emailSent: { type: boolean }
