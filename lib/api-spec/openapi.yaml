        - email
        - password
        - firstName
        - lastName
        - role

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
      required: [currentPassword, newPassword]

    ForgotPasswordRequest:
      type: object
      properties:
        email: { type: string }
      required: [email]

    ForgotPasswordResponse:
      type: object
      description: Always returns ok=true regardless of whether the email matches an account, to avoid account enumeration. The actual delivery result is recorded in server logs only and is never exposed in the response.
      properties:
        ok: { type: boolean }
      required: [ok]

    PasswordResetTokenInfo:
      type: object
      properties:
        email: { type: string, description: "Masked email address (e.g. j***@example.com)" }
        firstName: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [email, firstName, expiresAt]

    ResetPasswordRequest:
      type: object
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 8 }
      required: [token, newPassword]

    UpdateMyEmployeeResponse:
      description: |
        Employee row after the self-edit, plus an out-of-band signal the mobile
        UI uses to render a "HR was notified of this change" confirmation
        toast. `hrNotified` is `true` (and `hrNotifiedFields` non-empty) only
        when one or more high-risk fields actually changed value — banking,
        emergency contact, SSN, or signature.
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          properties:
            hrNotified:
              type: boolean
              description: True when an admin push + email was dispatched for this save.
            hrNotifiedFields:
              type: array
              description: List of high-risk field keys (camelCase) that triggered the notification.
              items: { type: string }

