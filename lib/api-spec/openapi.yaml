        lastName: { type: string }
        dateOfBirth: { type: string, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        phone: { type: string }
        address: { type: string }
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
        emergencyContactPhone: { type: string }
        uniformShirt: { type: string, nullable: true }
        uniformTrousers: { type: string, nullable: true }
        uniformJacket: { type: string, nullable: true }
        uniformBoots: { type: string, nullable: true }
        bankAccountName: { type: string, nullable: true }
        bankAccountNumber: { type: string, nullable: true }
        bankBsb: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        # Self-service document refresh (Task #31). Object paths returned
        # by POST /storage/uploads/request-url. Officers can replace their
        # own files but cannot edit license number / expiry / status.
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        licenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true }
        trainingCertificateKeys:
          type: array
          nullable: true
          items: { type: string }

    EmployeeChange:
      type: object
      required: [id, employeeUserId, source, field, changedAt]
      properties:
        id: { type: string }
        employeeUserId: { type: string }
        actorUserId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        source: { type: string, enum: [admin, self] }
        field: { type: string }
        fieldLabel: { type: string }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }

    UpdateEmployeeRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [active, inactive, pending]
        address: { type: string }
        dateOfBirth: { type: string, format: date, nullable: true }
        cityOfBirth: { type: string, nullable: true }
        stateOfBirth: { type: string, nullable: true }
        niNumber: { type: string, nullable: true }
        rightToWorkStatus: { type: string, nullable: true }
        rightToWorkDocKey: { type: string, nullable: true }
        siaLicenseNumber: { type: string, nullable: true }
        siaLicenseLevel: { type: integer, nullable: true, enum: [2, 3, 4] }
        siaLicenseExpiry: { type: string, format: date, nullable: true }
        licenseDocKey: { type: string, nullable: true }
        passportDocKey: { type: string, nullable: true }
        previousExperience: { type: string, nullable: true }
        yearsExperience: { type: integer, nullable: true }
        photoKey: { type: string, nullable: true }
        cvKey: { type: string, nullable: true }
        trainingCertificateKeys: { type: array, nullable: true, items: { type: string } }
        availability: { type: object, nullable: true, additionalProperties: true }
        emergencyContactName: { type: string }
        emergencyContactRelationship: { type: string, nullable: true }
