      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adminNote: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftRequest" }

  /admin/sites/{siteId}/subcontractor-qr:
    get:
      operationId: getSubcontractorQr
      tags: [sites]
      summary: Get the existing subcontractor QR clock-in token for a site (admin)
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Existing token (or exists=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorQrLookup" }
    post:
      operationId: generateSubcontractorQr
      tags: [sites]
      summary: Generate (or rotate) the subcontractor QR clock-in token for a site (admin)
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate: { type: boolean }
      responses:
        "200":
          description: QR token created or rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorQrResponse" }

  /admin/subcontractor-entries:
    get:
      operationId: getSubcontractorEntries
      tags: [timeEntries]
      summary: List all subcontractor time entries (admin), filterable by siteId / dateFrom / dateTo
      parameters:
        - { name: siteId, in: query, schema: { type: string } }
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubcontractorTimeEntry" }

  /admin/subcontractor-entries/{id}/clock-out:
    patch:
      operationId: adminClockOutSubcontractorEntry
      tags: [timeEntries]
      summary: Admin force-close a stuck subcontractor entry (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clockOutAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorTimeEntry" }

  /admin/subcontractor-entries/{id}:
    patch:
      operationId: adminUpdateSubcontractorEntry
      tags: [timeEntries]
      summary: Admin edit / correct a subcontractor time entry (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                company: { type: string }
                badgeId: { type: string, nullable: true }
                clockInAt: { type: string, format: date-time }
                clockOutAt: { type: string, format: date-time, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorTimeEntry" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Entry not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /subcontractor/clock/{token}:
    get:
      operationId: getSubcontractorClockInfo
      tags: [timeEntries]
      summary: Validate a site QR token and return site context (public)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token valid — site info returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorClockInfo" }
        "410":
          description: Token invalid or deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: subcontractorClockToggle
      tags: [timeEntries]
      summary: Toggle clock-in / clock-out for a subcontractor via the site QR token (public, rate-limited)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, company]
              properties:
                name: { type: string }
                company: { type: string }
                badgeId: { type: string }
      responses:
        "200":
          description: Clocked out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorClockToggleResponse" }
        "201":
          description: Clocked in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubcontractorClockToggleResponse" }
        "410":
          description: Token invalid or deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /payment-discrepancies:
    post:
      tags: [paymentDiscrepancies]
      operationId: createPaymentDiscrepancy
      summary: Submit a payment discrepancy report (officer)
      description: |
        Authenticated internal users (officer/site manager/employee/admin) report a pay
        discrepancy (missed payment, underpayment, missing hours, etc.). On
        submit the report is emailed to the dedicated admin inbox and becomes
        visible in the Admin Portal. External client accounts are rejected.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentDiscrepancyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDiscrepancy" }
        "400":
          description: Bad Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/payment-discrepancies:
    get:
      tags: [paymentDiscrepancies]
      operationId: listMyPaymentDiscrepancies
      summary: List the caller's own submitted payment discrepancies
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentDiscrepancy" }

components:
  schemas:
    # >>> FEATURE_KEYS:START — auto-generated from lib/feature-keys/src/index.ts.
    #     Do NOT edit the enum below by hand. Run
    #     `pnpm --filter @workspace/scripts run sync-feature-keys`
    #     (also runs automatically before `@workspace/api-spec` codegen). <<<
    FeatureKey:
      type: string
      description: >-
        Identifier for an owner-controlled, optionally-paid feature. Single
        source of truth is lib/feature-keys/src/index.ts; this enum is kept in
        sync by the sync-feature-keys script.
      enum:
        - chat
        - radio
        - incidents
        - payroll
        - invoicing
        - hr
        - liveMap
        - policies
        - swapRequests
        - licenseRenewals
        - dar
        - exports
        - trainings
        - patrol
        - availability
        - officerShares
    # >>> FEATURE_KEYS:END <<<

    BrandConfig:
      type: object
      required:
        - companyName
        - shortName
        - tagline
        - companyLicense
        - appName
        - colorNavy
        - colorGold
        - colorCream
        - features
      properties:
        companyName: { type: string }
        shortName: { type: string }
        tagline: { type: string }
        companyLicense:
          type: string
          description: >-
            Company/state security license line (e.g. "TX DPS Lic. #B12345").
            Empty string when not configured — clients hide it.
        appName: { type: string }
        colorNavy: { type: string }
        colorGold: { type: string }
        colorCream: { type: string }
        features:
          type: object
          description: >-
            Map of FeatureKey → enabled flag. Absent keys default to enabled on
            the client. Property keys are FeatureKey values.
          additionalProperties: { type: boolean }
          propertyNames: { $ref: "#/components/schemas/FeatureKey" }

    SubcontractorQrResponse:
      type: object
      required: [id, token, clockUrl, siteName, createdAt]
      properties:
        id: { type: string }
        token: { type: string }
        clockUrl: { type: string }
        siteName: { type: string }
        createdAt: { type: string, format: date-time }

    SubcontractorQrLookup:
      type: object
      required: [exists, siteName]
      properties:
        exists: { type: boolean }
        id: { type: string }
        token: { type: string }
        clockUrl: { type: string }
        siteName: { type: string }
        createdAt: { type: string, format: date-time }

    SubcontractorTimeEntry:
      type: object
      required: [id, siteId, name, company, clockInAt]
      properties:
        id: { type: string }
        siteId: { type: string }
        siteName: { type: string, nullable: true }
        name: { type: string }
        company: { type: string }
        badgeId: { type: string, nullable: true }
        clockInAt: { type: string, format: date-time }
        clockOutAt: { type: string, format: date-time, nullable: true }
        hoursWorked: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SubcontractorClockInfo:
      type: object
      required: [siteId, siteName, companies]
      properties:
        siteId: { type: string }
        siteName: { type: string }
        companies:
          type: array
          items: { type: string }
          description: >-
            Known subcontractor company names (master vendor records plus
            previously-seen companies) offered as a dropdown on the clock-in
            page, so the case-insensitive clock-out match isn't broken by
            spelling or casing drift.

    SubcontractorClockToggleResponse:
      type: object
      required: [action, entryId, name, company, siteName, clockInAt]
      properties:
        action: { type: string, enum: [clocked_in, clocked_out] }
        entryId: { type: string }
        name: { type: string }
        company: { type: string }
        siteName: { type: string }
        clockInAt: { type: string, format: date-time }
        clockOutAt: { type: string, format: date-time, nullable: true }
        hoursWorked: { type: string, nullable: true }

    RadioChannel:
      type: object
      required: [id, name, scope, adminOnly, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [global, all_officers, admins, site] }
        siteId: { type: string, nullable: true }
        siteName: { type: string, nullable: true }
        adminOnly: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateRadioChannelRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1 }
        scope: { type: string, enum: [global, all_officers, admins, site] }
        siteId: { type: string, nullable: true }

    UpdateRadioChannelRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        archived: { type: boolean }

    RadioTransmission:
      type: object
      required: [id, channelId, speakerUserId, startedAt]
      properties:
        id: { type: string }
        channelId: { type: string }
        speakerUserId: { type: string }
        speakerName: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        endedReason: { type: string, nullable: true }

