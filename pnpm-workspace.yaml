packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ~19.1.10
  '@types/react-dom': ~19.1.7
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: 0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.5
  wouter: ^3.3.5
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  shell-quote: file:./vendor/shell-quote
  # @types/react 19.2.x breaks class-component JSX (recharts 2.x XAxis/Tooltip,
  # expo BlurView/CameraView) under TS 5.9; runtime react is 19.1.0, so keep
  # the type packages pinned to the matching 19.1.x line everywhere.
  '@types/react': ~19.1.10
  '@types/react-dom': ~19.1.7
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  eas-cli>@expo/plist: 0.4.8
  # eas-cli's plist parser calls DOMParser.parseFromString without a mimeType,
  # which @xmldom/xmldom >=0.9 rejects ("Provisioning profile is malformed").
  # Keep plist on the 0.8 line (0.8.13 satisfies the security floor below).
  '@expo/plist>@xmldom/xmldom': 0.8.13
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-android-arm64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-darwin-arm64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-darwin-x64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-freebsd-x64': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm-gnueabihf': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-gnu': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-arm64-musl': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-linux-x64-musl': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-win32-arm64-msvc': '-'
  '@tailwindcss/oxide>@tailwindcss/oxide-win32-x64-msvc': '-'
  '@babel/core@7': ^7.29.6
  '@tootallnate/once@<3.0.1': '>=3.0.1'
  # Keep the legacy and modern minimatch branches on their respective patched
  # brace-expansion releases.
  brace-expansion@<1.1.17: '>=1.1.17 <2'
  brace-expansion@>=2.0.0 <2.0.3: '>=5.0.9 <6'
  brace-expansion@>=3.0.0 <5.0.8: '>=5.0.8'
  esbuild: 0.28.1
  form-data: ^4.0.6
  image-size@<=1.2.1: file:./vendor/image-size-secure
  ip-address@<10.5.0: '>=10.5.0'
  js-yaml: ^4.2.0
  joi@<17.13.4: '>=17.13.4'
  linkify-it@<=5.0.0: '>=5.0.1'
  markdown-it@<=14.1.1: '>=14.2.0'
